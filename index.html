<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>技術科 授業アプリ集</title>
  <meta name="description" content="中学校技術の授業で使えるWebサイトと自作アプリの一覧（教員向け）">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>技術科 授業アプリ集</h1>
      <p class="lead">授業で使えるWebサイトと自作アプリの一覧です。「開く」でそのまま使うか、「URLをコピー」で配布してください。</p>
    </div>
  </header>

  <main class="wrap">
    <section class="controls" aria-label="絞り込みと検索">
      <label class="search">
        <span class="visually-hidden">キーワードで検索</span>
        <input id="search" type="search" placeholder="キーワードで検索（例：プログラミング、回路）" autocomplete="off">
      </label>
      <div class="filters" id="filters" role="group" aria-label="単元で絞り込み"></div>
    </section>

    <p class="count" id="count" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>条件に合うものがありません。単元やキーワードを変えてみてください。</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">教員向けページです。生徒の個人情報は扱いません。</div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/app.js"></script>
</body>
</html>
